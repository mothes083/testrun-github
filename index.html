<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Static Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
        }

        header {
            background-color: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: #444;
            text-align: center;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
            font-size: 18px;
        }

        nav a:hover {
            color: #00bcd4;
        }

        .hero {
            background-color: #00bcd4;
            color: white;
            text-align: center;
            padding: 80px 20px;
        }

        .hero h1 {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 20px;
        }

        .content {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 50px 20px;
        }

        .card {
            background-color: white;
            width: 280px;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            margin-bottom: 15px;
        }

        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 30px;
        }

        @media (max-width: 768px) {
            .content {
                flex-direction: column;
                align-items: center;
            }

            .hero h1 {
                font-size: 35px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>My Website</h1>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

    <section class="hero">
        <h1>Welcome to My Website</h1>
        <p>This is a simple static website.</p>
    </section>

    <section class="content">

        <div class="card">
            <h2>HTML</h2>
            <p>HTML is used to create the structure of the website.</p>
        </div>

        <div class="card">
            <h2>CSS</h2>
            <p>CSS is used to design and style the website.</p>
        </div>

        <div class="card">
            <h2>JavaScript</h2>
            <p>JavaScript can be used to add interaction.</p>
        </div>

    </section>

    <footer>
        <p>© 2026 My Static Website</p>
    </footer>

</body>
</html>
